[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "charla-forecasting"
version = "2.0.0"
description = "¿Puede la IA predecir el futuro? Lecciones de forecasting desde el mundo real — Iquitos Data Fest 2026"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alex Prieto Romani", email = "alexprieto1997@gmail.com" }
]
license = { text = "MIT" }
keywords = ["forecasting", "time-series", "machine-learning", "deep-learning", "senamhi", "modis", "iquitos", "data-fest"]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
deeplearning = [
    "torch>=2.0.0",
    "chronos-forecasting>=0.0.4",
    "timesfm>=0.1.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "nbclient>=0.8.0",
    "nbformat>=5.9.0",
]
dev = [
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "black>=23.9.0",
]
